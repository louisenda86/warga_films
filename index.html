<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Warga Films · Studio</title>
  <meta name="description" content="Masuk ke studio Warga Films: dokumentari Bahasa Melayu sejak 2009 dari Pulau Borneo. Walk through the Warga Films documentary studio.">
  <meta name="theme-color" content="#0E1014">
  <link rel="icon" href="assets/img/brand/mark.png">
  <link rel="preload" href="assets/fonts/Butler_Black.otf" as="font" type="font/otf" crossorigin>
  <link rel="preload" href="assets/fonts/BarlowCondensed-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three/build/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }
  </script>
</head>
<body class="is-intro">
  <a class="skip" href="#topbar">Langkau ke kawalan · Skip to controls</a>
  <canvas id="gl" aria-label="Studio Warga Films 3D"></canvas>
  <div id="hotspots" aria-live="off"></div>

  <header id="topbar" class="hud">
    <button class="brand" id="brandBtn" type="button" aria-label="Warga Films">
      <span class="brand-w">WARGA</span><span class="brand-f"><i></i>FILMS</span>
    </button>
    <div class="top-actions">
      <div class="lang glass liquid" role="group" aria-label="Bahasa · Language">
        <button type="button" data-lang="ms">BM</button><button type="button" data-lang="en">EN</button>
      </div>
      <button class="chip glass liquid" id="soundBtn" type="button" aria-pressed="true"></button>
      <button class="chip glass liquid" id="indexBtn" type="button"></button>
    </div>
  </header>

  <div id="toast" class="glass liquid" role="status"></div>
  <div id="tip" class="glass" aria-hidden="true"></div>
  <nav id="dock" class="hud glass liquid" aria-label="Stesen · Stations"></nav>
  <div id="stick" class="hud glass" aria-hidden="true"><i></i></div>
  <div id="seat" class="glass liquid" hidden></div>
  <div id="play" class="glass" hidden></div>
  <button id="mini" class="glass liquid" type="button" hidden></button>

  <aside id="panel" class="glass" aria-hidden="true" tabindex="-1">
    <header class="panel-head">
      <span class="panel-kicker" id="panelKicker"></span>
      <button class="round" id="panelClose" type="button" aria-label="Tutup"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    </header>
    <div class="panel-body" id="panelBody"></div>
  </aside>

  <section id="intro">
    <div class="intro-strip" aria-hidden="true"><div class="strip-track" id="stripTrack"></div></div>
    <div class="intro-core">
      <p class="intro-fig">Fig. 00 &nbsp;·&nbsp; <span data-t="since"></span></p>
      <h1 class="logo" aria-label="Warga Films">
        <span class="logo-w" aria-hidden="true"><b>W</b><b>A</b><b>R</b><b>G</b><b>A</b></span>
        <span class="logo-f" aria-hidden="true"><i></i><em>FILMS</em></span>
      </h1>
      <p class="intro-line" id="introLine"></p>
      <div class="intro-actions">
        <div class="lang glass liquid" role="group" aria-label="Bahasa · Language">
          <button type="button" data-lang="ms">Bahasa Melayu</button><button type="button" data-lang="en">English</button>
        </div>
        <button id="enter" class="enter glass liquid" type="button" disabled>
          <svg class="leader" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="19" class="leader-bg"/><circle cx="22" cy="22" r="19" class="leader-fg" id="leaderArc"/><text x="22" y="28" text-anchor="middle" id="leaderNum">3</text></svg>
          <span id="enterLabel"></span>
        </button>
      </div>
      <p class="intro-note" data-t="introSound"></p>
    </div>
    <img class="intro-stamp" src="assets/img/brand/stamp.jpg" alt="" width="180" height="180">
  </section>

  <div id="burn" aria-hidden="true"><i></i><i></i><i></i><i></i><b></b></div>
  <div id="grain" aria-hidden="true"></div>
  <input id="songs" type="file" accept="audio/*,.mp3,.m4a,.flac,.wav,.ogg,.aac" multiple hidden>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="liquid" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="2" seed="9" result="n"/>
      <feGaussianBlur in="n" stdDeviation="2" result="nb"/>
      <feDisplacementMap in="SourceGraphic" in2="nb" scale="34" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="4"/><feDisplacementMap in="SourceGraphic" scale="5"/></filter>
  </svg>

  <noscript><p style="position:fixed;inset:0;display:grid;place-items:center;color:#EDE6D3;background:#0E1014;font-family:Georgia,serif;padding:24px;text-align:center">Studio Warga Films memerlukan JavaScript. · The Warga Films studio needs JavaScript.<br><a style="color:#FFB83F" href="https://www.youtube.com/@wargafilms">youtube.com/@wargafilms</a></p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
